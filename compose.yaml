services:
  app:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: ${DEPLOY_ENV_FILE:-.env.production}
    environment:
      DATA_DIR: /app/data
      NODE_ENV: production
    volumes:
      - app-data:/app/data
    expose:
      - "3000"
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{headers:{host:new URL(process.env.APP_ORIGIN).host,authorization:'Basic '+Buffer.from((process.env.ACCESS_USER||'nestopia')+':'+process.env.ACCESS_PASSWORD).toString('base64')}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: ${DEPLOY_ENV_FILE:-.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_started
volumes:
  app-data:
  caddy-data:
  caddy-config:
